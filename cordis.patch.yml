# The dsh-oss-sync bundle layer.
#
# The base composition mounts two file-backed stores — `dsh-settings-file`
# (`$DSH_HOME/settings.yaml`) and `dsh-credentials-local`
# (`$DSH_HOME/.credentials.yaml`). A loader patch can only override a row's
# `config`: its `name` is an assertion the patch must match, never a
# replacement. So this layer disables both rows and inserts the object-storage
# providers on their own ids.
#
# Values come from the launching environment so one installed bundle serves
# every machine; set them in the shell, in the profile's `cordis.patch.yml`,
# or in a `.env` the launcher reads.

- id: settings
  disabled: true

- id: credentials
  disabled: true

- insert:
    - id: oss-settings
      name: 'dsh-oss-sync/settings'
      config:
        bucket: !!js process.env.DSH_SYNC_BUCKET
        endpoint: !!js process.env.DSH_SYNC_ENDPOINT
        region: !!js process.env.DSH_SYNC_REGION ?? 'us-east-1'
        prefix: !!js process.env.DSH_SYNC_PREFIX ?? 'dsh-sync'
        pollMs: !!js Number(process.env.DSH_SYNC_POLL_MS ?? 30000)

    - id: oss-credentials
      name: 'dsh-oss-sync/credentials'
      config:
        bucket: !!js process.env.DSH_SYNC_BUCKET
        endpoint: !!js process.env.DSH_SYNC_ENDPOINT
        region: !!js process.env.DSH_SYNC_REGION ?? 'us-east-1'
        prefix: !!js process.env.DSH_SYNC_PREFIX ?? 'dsh-sync'
        pollMs: !!js Number(process.env.DSH_SYNC_POLL_MS ?? 30000)
