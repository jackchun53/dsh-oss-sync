# The dsh-oss-sync bundle layer (Harness 0.1.7 and later).
#
# Settings are not replaced any more. Harness 0.1.7 keeps every configurable
# value in the owning plugin's volatile Config and writes form edits into the
# profile's own `cordis.patch.yml`; `settings` (`@deepseek-ai/dsh-settings`) is
# the form projection over that, and it has to stay mounted — the Web and
# Desktop pages cannot start without it. `oss-settings` is inserted beside it:
# a client of `ctx.settings` that mirrors the profile's form values to the
# bucket and applies what other machines committed.
#
# Credentials are still replaced. A loader patch can only override a row's
# `config`: its `name` is an assertion the patch must match, never a
# replacement. So this layer disables the file-backed `credentials` row
# (`$DSH_HOME/.credentials.yaml`) and inserts the object-storage provider on
# its own id.
#
# Values come from the launching environment so one installed bundle serves
# every machine. They are bootstrap defaults: the Plugins-page section saves
# its own values into the profile, over these. None of them is a precondition
# for booting: an empty `bucket` starts both halves local-only.
#
# A `.env` is not a route for these names: the launcher treats every `DSH_*`
# variable as launch-environment-only and refuses one that a discovered file
# tries to set.

- id: credentials
  disabled: true

- insert:
    # Named by the bare package specifier: the browser module scan resolves a
    # package's dsh.client bundle from a Loader row named exactly this way, and
    # a row named by a subpath is permanently not a client row.
    - id: oss-settings
      name: 'dsh-oss-sync'
      config:
        bucket: !!js process.env.DSH_SYNC_BUCKET ?? ''
        endpoint: !!js process.env.DSH_SYNC_ENDPOINT
        region: !!js process.env.DSH_SYNC_REGION ?? 'us-east-1'
        prefix: !!js process.env.DSH_SYNC_PREFIX ?? 'dsh-sync'
        forcePathStyle: !!js process.env.DSH_SYNC_FORCE_PATH_STYLE === 'true'
        pollMs: !!js Number(process.env.DSH_SYNC_POLL_MS ?? 30000)

    - id: oss-credentials
      name: 'dsh-oss-sync/credentials'
      config:
        bucket: !!js process.env.DSH_SYNC_BUCKET ?? ''
        endpoint: !!js process.env.DSH_SYNC_ENDPOINT
        region: !!js process.env.DSH_SYNC_REGION ?? 'us-east-1'
        prefix: !!js process.env.DSH_SYNC_PREFIX ?? 'dsh-sync'
        forcePathStyle: !!js process.env.DSH_SYNC_FORCE_PATH_STYLE === 'true'
        pollMs: !!js Number(process.env.DSH_SYNC_POLL_MS ?? 30000)
