# The dsh-oss-sync bundle layer.
#
# The base composition mounts two file-backed stores — `dsh-settings-file`
# (`$DSH_HOME/settings.yaml`) and `dsh-credentials-local`
# (`$DSH_HOME/.credentials.yaml`). A loader patch can only override a row's
# `config`: its `name` is an assertion the patch must match, never a
# replacement. So this layer disables both rows and inserts the object-storage
# providers on their own ids.
#
# Values come from the launching environment so one installed bundle serves
# every machine; set them in the shell or in the profile's `cordis.patch.yml`.
# None of them is a precondition for booting: an empty `bucket` starts the
# providers local-only, and the settings card is where a connection is supplied
# (every surface, including Desktop, launches without one).
#
# A `.env` is not a route for these names: the launcher treats every `DSH_*`
# variable as launch-environment-only and refuses one that a discovered file
# tries to set.

- id: settings
  disabled: true

- id: credentials
  disabled: true

- insert:
    # Named by the bare package specifier: the browser module scan resolves a
    # package's dsh.client bundle from a Loader row named exactly this way, and
    # a row named by a subpath is permanently not a client row.
    - id: oss-settings
      name: 'dsh-oss-sync'
      config:
        # Empty is the local-only start: the seam is served from this machine's
        # document until the card saves a bucket.
        bucket: !!js process.env.DSH_SYNC_BUCKET ?? ''
        endpoint: !!js process.env.DSH_SYNC_ENDPOINT
        region: !!js process.env.DSH_SYNC_REGION ?? 'us-east-1'
        prefix: !!js process.env.DSH_SYNC_PREFIX ?? 'dsh-sync'
        pollMs: !!js Number(process.env.DSH_SYNC_POLL_MS ?? 30000)

    - id: oss-credentials
      name: 'dsh-oss-sync/credentials'
      config:
        bucket: !!js process.env.DSH_SYNC_BUCKET ?? ''
        endpoint: !!js process.env.DSH_SYNC_ENDPOINT
        region: !!js process.env.DSH_SYNC_REGION ?? 'us-east-1'
        prefix: !!js process.env.DSH_SYNC_PREFIX ?? 'dsh-sync'
        pollMs: !!js Number(process.env.DSH_SYNC_POLL_MS ?? 30000)
